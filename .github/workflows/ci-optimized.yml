name: CI optimized 64328
run-name: "CI optimized 64328 | ${{ github.head_ref || github.ref_name }} | @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - restore, build, test, publish
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ProductApi.Tests/ProductApi.Tests.csproj

      - name: Build
        run: dotnet build ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish ProductApi/ProductApi.csproj --configuration Release --no-build --output ${{ runner.temp }}/productapi

      - uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: ${{ runner.temp }}/productapi

  frontend:
    name: Frontend - install, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true
          cache: npm
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist
