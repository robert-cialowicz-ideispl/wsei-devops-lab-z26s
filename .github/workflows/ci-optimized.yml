name: CI - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5/sample-ci/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.Tests/Backend.Tests.csproj

      - name: Build
        run: dotnet build Backend.Tests/Backend.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Backend.Tests/Backend.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish Backend.Api/Backend.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: lab5/sample-ci/backend/publish/
          if-no-files-found: error

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist/
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          echo "Backend result: ${{ needs.backend.result }}"
          echo "Frontend result: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "Quality Gate PASSED: All dependent jobs succeeded."
            exit 0
          else
            echo "Quality Gate FAILED: One or more jobs failed."
            exit 1
          fi
