
name: CI - Optimized - 64368

run-name: "CI - Optimized | ${{ github.head_ref || github.ref_name }} | @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - build, test and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj

      - name: Build
        run: dotnet build lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish lab5/sample-ci/backend/ProductApi/ProductApi.csproj --configuration Release --no-build --no-restore --output ${{ runner.temp }}/productapi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: ${{ runner.temp }}/productapi

  frontend:
    name: Frontend - test and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist
