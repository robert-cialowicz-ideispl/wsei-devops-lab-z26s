name: CI - Optimized - 12345
run-name: "CI - Optimized | ${{ github.head_ref || github.ref_name }} | @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ProductApi.Tests/ProductApi.Tests.csproj
      - run: dotnet build ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-restore
      - run: dotnet test ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-build
      - run: dotnet publish ProductApi/ProductApi.csproj --configuration Release --no-build --output ${{ runner.temp }}/productapi
      - uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: ${{ runner.temp }}/productapi

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist
