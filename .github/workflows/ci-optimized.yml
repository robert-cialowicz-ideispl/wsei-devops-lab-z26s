name: CI - Optimized - 64308

on:
  push:
    branches:
      - 'lab5/**'
    paths:
      - 'lab5/**'
      - '.github/workflows/ci-optimized.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lab5/**'
      - '.github/workflows/ci-optimized.yml'

jobs:
  backend:
    name: Backend CI (Build, Test, Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore lab5/backend/backend.csproj

      - name: Build backend
        run: dotnet build lab5/backend/backend.csproj --no-restore

      - name: Test backend
        run: dotnet test lab5/backend/backend.csproj --no-build

      - name: Publish backend
        run: dotnet publish lab5/backend/backend.csproj -c Release -o ./publish/backend --no-build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish/backend

  frontend:
    name: Frontend CI (Install, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab5/frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: lab5/frontend

      - name: Test frontend
        run: npm test -- --watchAll=false
        working-directory: lab5/frontend

      - name: Build frontend
        run: npm run build
        working-directory: lab5/frontend

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: lab5/frontend/dist

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check Backend and Frontend status
        run: |
          echo "Backend status: ${{ needs.backend.result }}"
          echo "Frontend status: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Quality Gate Failed: Niektore z obowiazkowych zadan zakonczyly sie niepowodzeniem!"
            exit 1
          fi
          echo "Quality Gate Passed: Wszystkie joby ukonczone sukcesem!"
