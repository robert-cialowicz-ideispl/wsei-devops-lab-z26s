name: CI - Optimized

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj
      - name: Build
        run: dotnet build lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --no-build --configuration Release --logger trx
      - name: Publish
        run: dotnet publish lab5/sample-ci/backend/ProductApi/ProductApi.csproj --no-build --configuration Release --output ${{ runner.temp }}/productapi
      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ${{ runner.temp }}/productapi

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist

  quality-gate:
    name: Quality gate
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if either check failed
        if: ${{ always() && (needs.backend.result != 'success' || needs.frontend.result != 'success') }}
        run: exit 1
      - name: Confirm all checks passed
        run: echo "Backend and frontend checks passed."
