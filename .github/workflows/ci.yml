name: CI
run-name: "CI | ${{ github.head_ref || github.ref_name }} | @${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-optimized.yml'
      - 'lab5/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-restore:
    name: Backend - restore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj

  backend-build:
    name: Backend - build
    needs: backend-restore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj
      - run: dotnet build lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --configuration Release

  backend-test:
    name: Backend - test
    needs: backend-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test lab5/sample-ci/backend/ProductApi.Tests/ProductApi.Tests.csproj --configuration Release

  backend-publish:
    name: Backend - publish
    needs: backend-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish lab5/sample-ci/backend/ProductApi/ProductApi.csproj --configuration Release --output ${{ runner.temp }}/productapi
      - uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: ${{ runner.temp }}/productapi

  frontend-install:
    name: Frontend - install
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install

  frontend-test:
    name: Frontend - test
    needs: frontend-install
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm test -- --runInBand

  frontend-build:
    name: Frontend - build
    needs: frontend-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: lab5/sample-ci/frontend/dist
